
[env]
TERM = "xterm-256color"

[window]
padding = { x = 5, y = 5 }

[cursor]
style = { blinking = "On" }

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
   { key = "ArrowDown", mods = "Shift",   mode = "~Alt", action = "ReceiveChar" },
   { key = "ArrowDown", mods = "Control", mode = "~Alt", action = "ReceiveChar" },
]

[general]
import = [
    "~/.config/alacritty/themes/themes/monokai_charcoal.toml",
]

